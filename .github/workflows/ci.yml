name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: No merge-conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!docs' ':!scripts'; then
            echo "::error::unresolved merge-conflict markers found"; exit 1
          fi
      - name: Run unit tests
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v; else echo "no tests yet"; fi
